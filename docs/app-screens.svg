<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Pantallas principales del Gestor de Tareas ICE</title>
  <desc id="desc">Wireframe visual basado en Material UI para listado, formulario, sugerencia ICE por IA y resumen confirmado.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f7f9fc; }
      .surface { fill: #ffffff; stroke: #d9dee8; stroke-width: 1; }
      .appbar { fill: #1565c0; }
      .drawer { fill: #ffffff; stroke: #dde3ee; stroke-width: 1; }
      .primary { fill: #1565c0; }
      .secondary { fill: #00897b; }
      .accent { fill: #f9ab00; }
      .danger { fill: #c62828; }
      .muted { fill: #eef2f7; }
      .line { stroke: #c7d0df; stroke-width: 1; }
      .text { fill: #1f2937; font-family: "Roboto", "Segoe UI", Arial, sans-serif; }
      .label { fill: #5f6b7a; font-family: "Roboto", "Segoe UI", Arial, sans-serif; font-size: 12px; }
      .h1 { font-size: 22px; font-weight: 600; }
      .h2 { font-size: 16px; font-weight: 600; }
      .body { font-size: 13px; }
      .small { font-size: 11px; }
      .white { fill: #ffffff; }
      .chip { fill: #e3f2fd; }
      .chipText { fill: #0d47a1; font-family: "Roboto", "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="980"/>
  <text class="text h1" x="40" y="48">Gestor de Tareas ICE - estructura visual Material UI</text>
  <text class="label" x="40" y="72">Pantallas y componentes base para implementar el flujo de creacion, sugerencia IA y confirmacion.</text>

  <g id="main-layout" filter="url(#shadow)">
    <rect class="surface" x="40" y="110" width="420" height="300" rx="8"/>
    <rect class="appbar" x="40" y="110" width="420" height="48" rx="8"/>
    <rect class="appbar" x="40" y="148" width="420" height="10"/>
    <circle class="white" cx="64" cy="134" r="8"/>
    <text class="white text h2" x="86" y="140">MainLayout</text>
    <rect class="drawer" x="40" y="158" width="112" height="252"/>
    <rect class="muted" x="58" y="182" width="76" height="12" rx="6"/>
    <rect class="primary" x="58" y="214" width="76" height="28" rx="14"/>
    <text class="white text small" x="72" y="232">Tareas</text>
    <rect class="muted" x="58" y="260" width="66" height="12" rx="6"/>
    <rect class="muted" x="58" y="286" width="54" height="12" rx="6"/>
    <text class="text h2" x="176" y="194">Layout principal</text>
    <text class="label" x="176" y="218">AppBar, NavigationDrawer y zona de contenido.</text>
    <rect class="muted" x="176" y="244" width="240" height="46" rx="6"/>
    <text class="text body" x="192" y="272">Breadcrumbs / Filtros / Acciones</text>
    <rect class="surface" x="176" y="310" width="240" height="70" rx="8"/>
    <text class="text body" x="192" y="338">ContentContainer</text>
    <text class="label" x="192" y="360">Pantalla activa renderizada por ruta</text>
  </g>

  <g id="task-list" filter="url(#shadow)">
    <rect class="surface" x="510" y="110" width="420" height="300" rx="8"/>
    <rect class="appbar" x="510" y="110" width="420" height="48" rx="8"/>
    <rect class="appbar" x="510" y="148" width="420" height="10"/>
    <text class="white text h2" x="534" y="140">TasksListPage</text>
    <rect class="surface" x="534" y="180" width="180" height="38" rx="6"/>
    <text class="label" x="550" y="204">Buscar tarea</text>
    <rect class="surface" x="726" y="180" width="84" height="38" rx="6"/>
    <text class="label" x="746" y="204">Estado</text>
    <rect class="primary" x="790" y="344" width="112" height="40" rx="20"/>
    <text class="white text body" x="814" y="368">Crear</text>
    <circle class="white" cx="878" cy="364" r="10"/>
    <text class="primary text h2" x="873" y="370">+</text>
    <rect class="surface" x="534" y="238" width="368" height="52" rx="8"/>
    <text class="text body" x="552" y="260">Preparar propuesta comercial</text>
    <rect class="chip" x="552" y="270" width="66" height="18" rx="9"/>
    <text class="chipText" x="568" y="283">ICE 21</text>
    <rect class="surface" x="534" y="302" width="230" height="52" rx="8"/>
    <text class="text body" x="552" y="324">Revisar onboarding</text>
    <rect class="chip" x="552" y="334" width="60" height="18" rx="9"/>
    <text class="chipText" x="568" y="347">ICE 14</text>
  </g>

  <g id="task-form" filter="url(#shadow)">
    <rect class="surface" x="980" y="110" width="420" height="360" rx="8"/>
    <rect class="appbar" x="980" y="110" width="420" height="48" rx="8"/>
    <rect class="appbar" x="980" y="148" width="420" height="10"/>
    <text class="white text h2" x="1004" y="140">TaskCreatePage / TaskEditPage</text>
    <text class="text h2" x="1004" y="192">TaskForm</text>
    <rect class="surface" x="1004" y="210" width="360" height="42" rx="6"/>
    <text class="label" x="1020" y="235">Titulo de la tarea</text>
    <rect class="surface" x="1004" y="266" width="360" height="72" rx="6"/>
    <text class="label" x="1020" y="292">Descripcion</text>
    <rect class="surface" x="1004" y="352" width="168" height="42" rx="6"/>
    <text class="label" x="1020" y="377">Objetivo</text>
    <rect class="surface" x="1196" y="352" width="168" height="42" rx="6"/>
    <text class="label" x="1212" y="377">Plazo</text>
    <rect class="secondary" x="1004" y="414" width="176" height="40" rx="20"/>
    <text class="white text body" x="1026" y="439">Sugerir ICE con IA</text>
    <rect class="surface" x="1194" y="414" width="86" height="40" rx="20"/>
    <text class="text body" x="1218" y="439">Cancelar</text>
  </g>

  <g id="ai-panel" filter="url(#shadow)">
    <rect class="surface" x="40" y="500" width="420" height="350" rx="8"/>
    <rect class="secondary" x="40" y="500" width="420" height="48" rx="8"/>
    <rect class="secondary" x="40" y="538" width="420" height="10"/>
    <text class="white text h2" x="64" y="531">AiIceSuggestionPanel</text>
    <text class="text h2" x="64" y="590">Sugerencia ICE por IA</text>
    <rect class="chip" x="300" y="568" width="88" height="28" rx="14"/>
    <text class="chipText" x="324" y="587">ICE 18.7</text>
    <text class="label" x="64" y="626">Impacto</text>
    <line class="line" x1="130" y1="622" x2="360" y2="622"/>
    <circle class="primary" cx="304" cy="622" r="8"/>
    <text class="text body" x="374" y="627">8</text>
    <text class="label" x="64" y="666">Confianza</text>
    <line class="line" x1="130" y1="662" x2="360" y2="662"/>
    <circle class="primary" cx="282" cy="662" r="8"/>
    <text class="text body" x="374" y="667">7</text>
    <text class="label" x="64" y="706">Esfuerzo</text>
    <line class="line" x1="130" y1="702" x2="360" y2="702"/>
    <circle class="accent" cx="196" cy="702" r="8"/>
    <text class="text body" x="374" y="707">3</text>
    <rect class="muted" x="64" y="732" width="332" height="54" rx="6"/>
    <text class="text body" x="80" y="756">Justificacion IA: alto impacto, esfuerzo bajo</text>
    <text class="label" x="80" y="776">y confianza suficiente para priorizar.</text>
    <rect class="primary" x="64" y="804" width="96" height="36" rx="18"/>
    <text class="white text body" x="86" y="827">Aceptar</text>
    <rect class="surface" x="176" y="804" width="92" height="36" rx="18"/>
    <text class="text body" x="205" y="827">Editar</text>
    <rect class="surface" x="284" y="804" width="112" height="36" rx="18"/>
    <text class="text body" x="308" y="827">Reintentar</text>
  </g>

  <g id="review-confirm" filter="url(#shadow)">
    <rect class="surface" x="510" y="500" width="420" height="350" rx="8"/>
    <rect class="appbar" x="510" y="500" width="420" height="48" rx="8"/>
    <rect class="appbar" x="510" y="538" width="420" height="10"/>
    <text class="white text h2" x="534" y="531">ReviewTaskSummary</text>
    <text class="text h2" x="534" y="590">Revision antes de confirmar</text>
    <rect class="surface" x="534" y="612" width="360" height="58" rx="8"/>
    <text class="text body" x="552" y="636">Tarea: Preparar propuesta comercial</text>
    <text class="label" x="552" y="656">Objetivo: ventas | Plazo: esta semana</text>
    <rect class="surface" x="534" y="686" width="110" height="82" rx="8"/>
    <text class="label" x="558" y="714">Impacto</text>
    <text class="text h1" x="570" y="748">8</text>
    <rect class="surface" x="658" y="686" width="110" height="82" rx="8"/>
    <text class="label" x="680" y="714">Confianza</text>
    <text class="text h1" x="694" y="748">7</text>
    <rect class="surface" x="782" y="686" width="110" height="82" rx="8"/>
    <text class="label" x="810" y="714">Esfuerzo</text>
    <text class="text h1" x="820" y="748">3</text>
    <rect class="secondary" x="534" y="794" width="132" height="40" rx="20"/>
    <text class="white text body" x="568" y="819">Confirmar</text>
    <rect class="surface" x="682" y="794" width="96" height="40" rx="20"/>
    <text class="text body" x="710" y="819">Editar</text>
  </g>

  <g id="confirmed" filter="url(#shadow)">
    <rect class="surface" x="980" y="520" width="420" height="330" rx="8"/>
    <rect class="secondary" x="980" y="520" width="420" height="48" rx="8"/>
    <rect class="secondary" x="980" y="558" width="420" height="10"/>
    <text class="white text h2" x="1004" y="551">TaskConfirmedPage</text>
    <circle class="secondary" cx="1054" cy="628" r="30"/>
    <path d="M1039 628 L1050 640 L1071 614" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="text h2" x="1102" y="620">Tarea confirmada</text>
    <text class="label" x="1102" y="642">La tarea se guardo con ICE sugerido por IA.</text>
    <rect class="muted" x="1004" y="684" width="360" height="76" rx="8"/>
    <text class="text body" x="1022" y="710">Preparar propuesta comercial</text>
    <text class="label" x="1022" y="734">ICE final: 18.7 | Origen: IA revisada</text>
    <rect class="primary" x="1004" y="790" width="132" height="40" rx="20"/>
    <text class="white text body" x="1030" y="815">Ver listado</text>
    <rect class="surface" x="1152" y="790" width="134" height="40" rx="20"/>
    <text class="text body" x="1178" y="815">Crear otra</text>
  </g>

  <path d="M460 260 C485 260 485 260 510 260" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M930 260 C955 260 955 260 980 260" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M1190 470 C1190 500 460 470 260 500" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M460 675 C485 675 485 675 510 675" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M930 675 C955 675 955 675 980 675" fill="none" stroke="#7b8794" stroke-width="2" stroke-dasharray="5 5"/>
</svg>
